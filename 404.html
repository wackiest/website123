<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="This page could not be found.">
  <meta name="robots" content="noindex">
  <title>Page not found — Scythe Optimizations</title>

  <!-- Absolute paths so this works from any URL that 404s -->
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080808;
      --text: #ededed;
      --muted: #8c8c8c;
      --line: rgba(255, 255, 255, .1);
      --red: #a90d20;
      --red-bright: #d1202f;
      --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --pad: clamp(20px, 5vw, 56px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }

    html {
      background: var(--bg);
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background: transparent; /* html paints the black; body must not cover the background layers */
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ---------- Background ---------- */

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(105, 0, 16, .15), transparent 58%),
        var(--bg);
    }

    .atmosphere::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .026) 1px, transparent 1px);
      background-size: 68px 68px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000, transparent 84%);
      mask-image: radial-gradient(ellipse at center, #000, transparent 84%);
    }

    .atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
    }

    .glow {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      width: 480px;
      height: 480px;
      margin: -240px 0 0 -240px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle, rgba(150, 0, 20, .09), transparent 70%);
      transition: opacity .8s ease;
      will-change: transform;
    }

    .glow.is-on { opacity: 1; }

    /* ---------- Layout ---------- */

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      padding-left: max(var(--pad), env(safe-area-inset-left));
      padding-right: max(var(--pad), env(safe-area-inset-right));
    }

    header { padding-top: max(24px, env(safe-area-inset-top)); }
    footer { padding-bottom: max(22px, env(safe-area-inset-bottom)); color: #7a7a7a; font-size: 13px; }

    .name {
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.01em;
      text-decoration: none;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 14px 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .03);
      color: #b5b5b5;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .status i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red-bright);
      box-shadow: 0 0 10px rgba(209, 32, 47, .8);
      animation: pulse 2.4s ease-in-out infinite;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px max(var(--pad), env(safe-area-inset-left)) 48px;
      text-align: center;
    }

    /* ---------- Hero ---------- */

    .badge {
      position: relative;
      width: clamp(72px, 9vw, 96px);
      height: clamp(72px, 9vw, 96px);
      margin-bottom: clamp(20px, 3vw, 32px);
      animation: rise 1s cubic-bezier(.2, .8, .2, 1) both;
    }


    .badge img {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      position: relative;
      padding: 0 .06em .08em 0;
      font-size: clamp(56px, 12.5vw, 156px);
      font-weight: 900;
      line-height: .95;
      letter-spacing: -.055em;
      color: transparent;
      background:
        linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .6) 50%, transparent 65%) -150% 0 / 60% 100% no-repeat,
        linear-gradient(180deg, #f6f6f6 10%, #8d8d8d 90%);
      -webkit-background-clip: text;
      background-clip: text;
      user-select: none;
      animation:
        rise 1s .12s cubic-bezier(.2, .8, .2, 1) both,
        sheen 8s 2.2s ease-in-out infinite;
    }

    .rule {
      width: 44px;
      height: 2px;
      margin: clamp(18px, 2.5vw, 28px) 0;
      background: var(--red);
      box-shadow: 0 0 18px rgba(169, 13, 32, .7);
      animation: rise 1s .24s cubic-bezier(.2, .8, .2, 1) both;
    }

    .lede {
      max-width: 36ch;
      color: var(--muted);
      font-size: clamp(16px, 1.5vw, 18px);
      line-height: 1.6;
      text-wrap: balance;
      animation: rise 1s .3s cubic-bezier(.2, .8, .2, 1) both;
    }

    .lede strong { color: var(--text); font-weight: 600; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
      margin-top: clamp(24px, 3vw, 34px);
      padding: 0 26px;
      border-radius: 999px;
      color: #080808;
      background: var(--text);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color .2s ease, color .2s ease, box-shadow .2s ease, transform .2s ease;
      animation: rise 1s .38s cubic-bezier(.2, .8, .2, 1) both;
    }

    .button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .button:hover {
      color: #fff;
      background: var(--red);
      box-shadow: 0 8px 32px rgba(169, 13, 32, .4);
    }

    .button:active { transform: scale(.98); }

    a:focus-visible {
      outline: 2px solid var(--red-bright);
      outline-offset: 4px;
    }

    /* ---------- Motion ---------- */

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes pulse { 50% { opacity: .35; } }

    @keyframes sheen {
      0%, 55% { background-position: -150% 0, 0 0; }
      100%    { background-position: 250% 0, 0 0; }
    }


    /* ---------- Mobile ---------- */

    @media (max-width: 600px) {
      .name { font-size: 14px; }
      .status { padding: 6px 12px 6px 10px; font-size: 12px; }
      h1 { font-size: 19vw; }
      
      .atmosphere::before { background-size: 48px 48px; }
      .button { width: 100%; max-width: 340px; }
      footer { justify-content: center; }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      main { padding-top: 16px; padding-bottom: 16px; }
      .badge { display: none; }
      h1 { font-size: clamp(48px, 14vh, 96px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <header>
    <a class="name" href="/">Scythe Optimizations</a>
    <div class="status"><i aria-hidden="true"></i>Error 404</div>
  </header>

  <main>
    <div class="badge">
      <img src="/assets/scythe-badge.png" alt="Scythe badge" width="96" height="96">
    </div>

    <h1>404</h1>
    <div class="rule" aria-hidden="true"></div>

    <p class="lede"><strong>This page doesn’t exist.</strong> The link may be broken, or the page may have moved.</p>

    <a class="button" href="/">
      Back to home
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </main>

  <footer>© 2026 Scythe Optimizations</footer>

  <script>
    (function () {
      var glow = document.getElementById("glow");
      var finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!finePointer || reduced) return;

      var tx = window.innerWidth / 2, ty = window.innerHeight / 2;
      var x = tx, y = ty, running = false;

      function frame() {
        x += (tx - x) * 0.08;
        y += (ty - y) * 0.08;
        glow.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
        if (Math.abs(tx - x) > 0.5 || Math.abs(ty - y) > 0.5) {
          requestAnimationFrame(frame);
        } else {
          running = false;
        }
      }

      window.addEventListener("pointermove", function (e) {
        tx = e.clientX;
        ty = e.clientY;
        glow.classList.add("is-on");
        if (!running) { running = true; requestAnimationFrame(frame); }
      }, { passive: true });

      document.addEventListener("pointerleave", function () {
        glow.classList.remove("is-on");
      });
    })();
  </script>
</body>
</html>
